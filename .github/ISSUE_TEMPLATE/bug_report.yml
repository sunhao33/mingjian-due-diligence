name: 🐞 问题反馈（Bug Report）
description: 报告运行、解析、指标计算或规则匹配中的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供完整信息，便于我们快速定位问题。

  - type: input
    id: version
    attributes:
      label: 环境信息
      description: Python 版本、操作系统、依赖版本（可用 `python --version` 查看）
      placeholder: "Python 3.11 / Windows 11 / deepseek-chat"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？预期是什么？
      placeholder: "运行 `python main.py risky` 时……"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按步骤描述如何复现该问题
      placeholder: "1. 执行命令 …… 2. 选择样例 …… 3. 观察输出 ……"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错日志 / 输出
      description: 粘贴相关报错信息或异常输出（如有）
      render: shell

  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 其他有助于定位问题的信息（如财报文件类型、是否扫描件等）
