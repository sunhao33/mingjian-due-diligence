name: 💡 功能建议（Feature Request）
description: 提出新功能、新规则或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请说明需求背景与期望效果，帮助我们判断优先级。

  - type: textarea
    id: problem
    attributes:
      label: 背景与痛点
      description: 你想解决什么问题？当前有哪些不足？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望如何实现？可描述功能形态或给出示意
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式？

  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 其他相关信息（如行业基准来源、规则口径等）
